logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG         # In ra toàn bộ câu lệnh SQL chạy ngầm
    org.hibernate.orm.jdbc.bind: TRACE # In ra chính xác các giá trị (tham số) truyền vào DB
    org.springframework.web: DEBUG   # Theo dõi sát sao các request gọi từ Frontend vào Controller