server:
  port: 8083
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: shipment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_service_db
    username: postgres
    password: Abc123456
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
    defer-datasource-initialization: true

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

google:
  cloud:
    storage:
      bucket-name: smartship-shipment-danh
      project-id: smartship-backend
      credentials-path: classpath:gcp-service-account.json

