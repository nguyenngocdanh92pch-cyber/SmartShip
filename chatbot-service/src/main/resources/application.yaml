server:
  port: 8087

spring:
  application:
    name: chatbot-service

  datasource:
    url: jdbc:postgresql://localhost:5433/chatbot_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    # 🌟 Dùng khung OpenAI nhưng trỏ đường dẫn về máy chủ Groq
    openai:
      api-key: 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
      base-url: https://api.groq.com/openai
      chat:
        options:
          # Dùng mô hình Llama 3 cực kỳ thông minh của Meta
          model: llama-3.3-70b-versatile

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 384
        initialize-schema: true